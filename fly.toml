# Sprint 3.6.9 Block 1 -- Fly.io deployment config.
#
# NOT deployed by this block (per the owner's explicit instructions: no Fly
# account, app, volume, or secret was created on your behalf). This file
# makes the repository deployment-ready; you run the `fly` CLI steps in the
# Block 1 report to actually stand it up.
#
# `app` and `primary_region` below are placeholders -- `fly launch`
# (recommended) generates/overwrites both with your real app name and chosen
# region; adjust them here if you deploy by hand instead.

app = "stratus-api"
primary_region = "iad"

[build]

[env]
  # Non-secret configuration only -- FMP_API_KEY, ANTHROPIC_API_KEY, and any
  # other credential are supplied via `fly secrets set`, never here (this
  # file is committed to the repo). See the Block 1 report's "exact Fly
  # steps" section for the full list and exact commands.
  STRATUS_RUNTIME_MODE = "beta"
  STRATUS_PERSIST_MEMORY = "true"
  STRATUS_STATE_DB_PATH = "/data/stratus_state.db"
  STRATUS_LEGACY_MEMORY_DB_PATH = "/data/logan_memory.db"
  # Uncomment and set once you've decided which tickers/capabilities this
  # deployment should run with (see config.py for what each flag does):
  # STRATUS_LIVE_STOCK_TICKERS = "NVDA,TSLA,AAPL"
  # STRATUS_LLM_ASK = "true"
  # STRATUS_CORS_ALLOWED_ORIGINS = "https://your-real-origin.example.com"

# Durable state lives here -- MemoryStore's SQLite file, the legacy
# memory_engine.py database, and NotificationStore's SQLite file (which
# self-locates as a sibling of STRATUS_STATE_DB_PATH, see
# config.notification_store_db_path()) all resolve under this one mount, so
# one volume covers every durable store this app currently has.
[[mounts]]
  source = "stratus_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # Sprint 3.6.9 Block 1 architecture constraint: STRATUS Watch's
  # notification poller (backend/app/main.py's `_notification_poll_loop`)
  # runs as an in-process asyncio task for the life of the server process --
  # it only notices a newly-qualifying opportunity while that process is
  # actually running. Fly's default scale-to-zero behavior would silently
  # break real-world push delivery (Watch would only "wake up" on the next
  # inbound request), so this deployment intentionally keeps exactly one
  # machine running continuously rather than scaling to zero when idle.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
